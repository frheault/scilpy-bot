[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scilpy-bot"
version = "0.0.1"
authors = [
  { name="Example Author", email="author@example.com" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/scilus/scilpy-bot/"
"Bug Tracker" = "https://github.com/scilus/scilpy-bot/issues"

[project.scripts]
scil_chatbot = "scilpy_bot.scil_chatbot:main"
